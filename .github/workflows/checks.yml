name: checks
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: node --import tsx scripts/verify-database-contract.ts
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: node --import tsx scripts/verify-production.ts
      - run: node --import tsx scripts/verify-package.ts
      - run: node --import tsx scripts/verify-upgrade.ts
  e2e:
    runs-on: ubuntu-latest
    # Browser dependencies can take over 10 minutes to install on a cold runner.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Preserve Playwright's fonts and shared libraries, but avoid the Azure HTTP
      # mirror that has stretched a shard's package downloads past ten minutes.
      - name: Prefer the official Ubuntu HTTPS mirror for browser dependencies
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      # Each runner has its own fixture server; tests within a shard stay serial.
      - run: pnpm test:e2e --shard=${{ matrix.shard }}/6
  # Keep the existing required check green only when every job passed.
  verify:
    if: ${{ always() }}
    needs: [quality, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require all checks to pass
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          echo "quality: $QUALITY_RESULT; e2e: $E2E_RESULT"
          [[ "$QUALITY_RESULT" == success && "$E2E_RESULT" == success ]]
